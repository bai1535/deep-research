# ── Deep Research — production stack ────────────────────────────────
services:
  postgres:
    image: postgres:16-alpine
    container_name: deep-research-db
    environment:
      - POSTGRES_DB=deep_research
      - POSTGRES_USER=researcher
      - POSTGRES_PASSWORD=${DB_PASSWORD:-deepresearch}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U researcher -d deep_research"]
      interval: 10s
      timeout: 3s
      retries: 5

  deep-research:
    build: .
    container_name: deep-research
    ports:
      - "${WEB_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://researcher:${DB_PASSWORD:-deepresearch}@postgres:5432/deep_research
      - RESEARCH_OUTPUT_DIR=/app/runs
      - WEB_PORT=8000
    volumes:
      - ./runs:/app/runs
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
      - ./src:/app/src:ro
      - ./web:/app/web:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
